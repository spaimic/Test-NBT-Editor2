plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.spaimic.nbttool'
    compileSdk 34

    defaultConfig {
        applicationId "com.spaimic.nbttool"
        minSdk 28
        targetSdk 33
        // GitHub Actions run numbers provide monotonically increasing version
        // codes. The offset keeps them newer than the original versionCode 1.
        def githubRunNumber = System.getenv("GITHUB_RUN_NUMBER")
        versionCode githubRunNumber ? (1000 + githubRunNumber.toInteger()) : 2
        versionName githubRunNumber ? "0.1.${githubRunNumber}" : "0.1.1"
    }

    def signingKeystorePath = System.getenv("SIGNING_KEYSTORE_PATH")

    signingConfigs {
        if (signingKeystorePath) {
            persistent {
                storeFile file(signingKeystorePath)
                storePassword System.getenv("SIGNING_STORE_PASSWORD") ?: ""
                keyAlias System.getenv("SIGNING_KEY_ALIAS") ?: ""
                keyPassword System.getenv("SIGNING_KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        debug {
            // GitHub Actions supplies a persistent signing key so every APK can
            // update the previously installed APK instead of conflicting with it.
            // Local builds without the secret continue using Android's normal debug key.
            if (signingKeystorePath) {
                signingConfig signingConfigs.persistent
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

configurations.all {
    // guava-21.0 (pulled in transitively by leveldb) already contains a real
    // ListenableFuture class; the separate "listenablefuture" placeholder
    // artifact some other dependency wants collides with it. Drop the placeholder.
    exclude group: 'com.google.guava', module: 'listenablefuture'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Shizuku — lets us reach into Android/data/com.mojang.minecraftpe without root
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // NOTE: LevelDB itself is NOT pulled from Maven — the org.iq80.leveldb source is
    // vendored directly under app/src/main/java/org/iq80/leveldb, patched to decompress
    // Bedrock Edition's zlib-compressed blocks (the stock library only supports Snappy).
    // It still needs Guava for the same reason the original artifact did.
    implementation 'com.google.guava:guava:32.1.3-android'
}
