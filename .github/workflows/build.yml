name: Build debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Restore persistent signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then
            echo "::error::Missing SIGNING_KEYSTORE_B64 repository secret."
            echo "Create the persistent keystore and add it as a GitHub Actions secret before building."
            exit 1
          fi
          mkdir -p app/signing
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > app/signing/persistent-release.jks
          test -s app/signing/persistent-release.jks

      - name: Build debug APK
        env:
          SIGNING_KEYSTORE_PATH: signing/persistent-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NbtTool-debug-apk
          path: app/build/outputs/apk/debug/*.apk
